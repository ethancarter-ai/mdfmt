[project]
name = "mdfmt"
version = "0.1.0"
description = "Markdown formatter CLI — normalize indentation, spacing, heading hierarchy, and list alignment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
mdfmt = "mdfmt:main"

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["mdfmt"]
